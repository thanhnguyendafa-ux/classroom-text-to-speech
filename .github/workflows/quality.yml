name: Quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Firestore integration and rules
        run: npx firebase emulators:exec --project demo-classroom-tts --only firestore "tsx --test --test-concurrency=1 test/firestore.rules.test.ts test/firebase-admin.smoke.ts test/playlist-storage.smoke.ts test/rate-limiter.smoke.ts"
      - name: Storage rules
        run: npx firebase emulators:exec --project demo-classroom-tts --only storage "tsx --test test/storage.rules.test.ts"
      - run: npm run build
